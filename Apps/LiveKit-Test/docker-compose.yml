name: livekit-test

services:
  livekit:
    image: livekit/livekit-server:v1.13.5
    container_name: livekit-test
    command:
      - --dev
      - --bind
      - 0.0.0.0
    network_mode: host
    restart: unless-stopped

x-casaos:
  id: com.aboulang.casaos.livekit-test
  main: livekit
  index: /
  port_map: "7880"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/livekit.png
  title:
    en_us: LiveKit Test Server
  tagline:
    en_us: LAN-only LiveKit server for WebRTC development
  description:
    en_us: Development LiveKit server for browser and Flutter WebRTC experiments. It uses LiveKit dev mode and host networking.
  author: agb
  developer: LiveKit
  category: AGB
  architectures:
    - amd64
  version: "1.13.5"
  website: https://livekit.io
  repo: https://github.com/livekit/livekit
