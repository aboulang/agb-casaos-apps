name: Validate CasaOS Apps

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate every app
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "Validating $file"
            docker compose -f "$file" config --quiet
          done < <(find Apps -mindepth 2 -maxdepth 2 -name docker-compose.yml -print | sort)
